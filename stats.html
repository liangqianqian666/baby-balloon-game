<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Analytics Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 30px; max-width: 900px; margin: 0 auto; }
  h1 { color: #333; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 20px 0; }
  .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
  .stat-card .number { font-size: 36px; font-weight: bold; color: #4488FF; }
  .stat-card .label { font-size: 14px; color: #888; margin-top: 5px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #4488FF; color: white; }
  .session-list { margin-top: 20px; }
  h2 { color: #555; margin-top: 30px; }
  .note { color: #888; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>🎈 Game Analytics</h1>
  <p class="note">数据存储在每个玩家浏览器的 localStorage 中。此面板显示当前浏览器的数据。</p>

  <div class="stats" id="stats"></div>

  <h2>关卡游玩次数</h2>
  <table id="level-table">
    <thead><tr><th>关卡</th><th>游玩次数</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>最近会话</h2>
  <table id="session-table">
    <thead><tr><th>时间</th><th>用户ID</th><th>时长</th><th>事件数</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="js/analytics.js?v=4"></script>
  <script>
    const summary = Analytics.getSummary();

    // 总览卡片
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="number">${summary.uniqueUsers}</div><div class="label">独立用户</div></div>
      <div class="stat-card"><div class="number">${summary.totalSessions}</div><div class="label">总会话数</div></div>
      <div class="stat-card"><div class="number">${summary.totalDurationMin}m</div><div class="label">总使用时长</div></div>
      <div class="stat-card"><div class="number">${summary.avgDurationMin}m</div><div class="label">平均会话时长</div></div>
    `;

    // 关卡表
    const levelBody = document.querySelector('#level-table tbody');
    Object.entries(summary.levelPlays).sort((a,b) => b[1]-a[1]).forEach(([level, count]) => {
      levelBody.innerHTML += `<tr><td>${level}</td><td>${count}</td></tr>`;
    });
    if (Object.keys(summary.levelPlays).length === 0) {
      levelBody.innerHTML = '<tr><td colspan="2">暂无数据</td></tr>';
    }

    // 会话表
    const sessBody = document.querySelector('#session-table tbody');
    summary.history.slice(-20).reverse().forEach(s => {
      const time = new Date(s.startTime).toLocaleString();
      const dur = Math.round((s.duration || 0) / 60000) + 'min';
      const events = (s.events || []).length;
      sessBody.innerHTML += `<tr><td>${time}</td><td>${s.userId?.slice(0,12)}...</td><td>${dur}</td><td>${events}</td></tr>`;
    });
  </script>
</body>
</html>
