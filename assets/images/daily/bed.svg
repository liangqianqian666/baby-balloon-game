<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Headboard -->
  <rect x="20" y="50" width="160" height="40" rx="10" fill="#8B5E3C"/>
  <!-- Mattress -->
  <rect x="15" y="85" width="170" height="60" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Pillow -->
  <ellipse cx="55" cy="95" rx="30" ry="15" fill="#FFE88D"/>
  <!-- Blanket -->
  <rect x="15" y="110" width="170" height="40" rx="8" fill="#87CEEB"/>
  <rect x="15" y="110" width="170" height="10" rx="5" fill="#B0E0E6"/>
  <!-- Legs -->
  <rect x="25" y="148" width="10" height="25" rx="3" fill="#8B5E3C"/>
  <rect x="165" y="148" width="10" height="25" rx="3" fill="#8B5E3C"/>
  <!-- Eyes on pillow -->
  <circle cx="45" cy="92" r="4" fill="#3A3A3A"/>
  <circle cx="65" cy="92" r="4" fill="#3A3A3A"/>
  <circle cx="46" cy="91" r="1.5" fill="white"/>
  <circle cx="66" cy="91" r="1.5" fill="white"/>
  <!-- Sleeping mouth -->
  <path d="M50,100 Q55,104 60,100" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Zzz -->
  <text x="140" y="50" font-size="18" font-family="Arial" fill="#87CEEB" font-weight="bold">z</text>
  <text x="150" y="38" font-size="14" font-family="Arial" fill="#87CEEB" font-weight="bold">z</text>
  <text x="158" y="28" font-size="10" font-family="Arial" fill="#87CEEB" font-weight="bold">z</text>
</svg>