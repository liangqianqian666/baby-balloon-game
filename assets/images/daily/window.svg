<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Frame -->
  <rect x="30" y="30" width="140" height="140" rx="5" fill="#8B5E3C"/>
  <!-- Glass -->
  <rect x="40" y="40" width="120" height="120" rx="3" fill="#87CEEB"/>
  <!-- Cross bars -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="white" stroke-width="4"/>
  <line x1="40" y1="100" x2="160" y2="100" stroke="white" stroke-width="4"/>
  <!-- Sky reflection -->
  <ellipse cx="80" cy="70" rx="20" ry="15" fill="white" opacity="0.3"/>
  <!-- Curtain left -->
  <path d="M35,35 Q50,50 45,80 Q38,60 35,35Z" fill="#FFB6C1" opacity="0.5"/>
  <!-- Curtain right -->
  <path d="M165,35 Q150,50 155,80 Q162,60 165,35Z" fill="#FFB6C1" opacity="0.5"/>
  <!-- Eyes -->
  <circle cx="82" cy="90" r="6" fill="#3A3A3A"/>
  <circle cx="118" cy="90" r="6" fill="#3A3A3A"/>
  <circle cx="84" cy="88" r="2.5" fill="white"/>
  <circle cx="120" cy="88" r="2.5" fill="white"/>
  <!-- Mouth -->
  <path d="M92,110 Q100,118 108,110" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>