  <rect x="35" y="25" width="130" height="155" rx="8" fill="#C0C0C0"/>
  <!-- Doors -->
  <rect x="45" y="55" width="50" height="115" rx="3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
  <rect x="105" y="55" width="50" height="115" rx="3" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
  <!-- Door gap -->
  <line x1="100" y1="55" x2="100" y2="170" stroke="#A0A0A0" stroke-width="2"/>
  <!-- Display -->
  <rect x="75" y="32" width="50" height="18" rx="4" fill="#3A3A3A"/>
  <text x="100" y="46" text-anchor="middle" font-size="14" font-family="Arial" fill="#4CAF50" font-weight="bold">▲1</text>
  <!-- Buttons -->
  <circle cx="163" cy="100" r="5" fill="#FFD93D"/>
  <circle cx="163" cy="115" r="5" fill="#87CEEB"/>
  <!-- Eyes on doors -->
  <circle cx="82" cy="100" r="6" fill="#3A3A3A"/>
  <circle cx="118" cy="100" r="6" fill="#3A3A3A"/>
  <circle cx="84" cy="98" r="2.5" fill="white"/>
  <circle cx="120" cy="98" r="2.5" fill="white"/>
  <!-- Mouth -->
  <path d="M93,120 Q100,127 107,120" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
