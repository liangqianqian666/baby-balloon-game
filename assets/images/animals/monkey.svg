  <ellipse cx="128" cy="170" rx="14" ry="10" fill="#FDDCB5" stroke="#E0C8A0" stroke-width="1"/>
  <!-- Tail -->
  <path d="M148,135 Q172,120 175,100 Q178,85 168,80" stroke="#8B6B4A" stroke-width="6" fill="none" stroke-linecap="round"/>
