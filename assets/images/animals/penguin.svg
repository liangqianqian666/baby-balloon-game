<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="45" ry="48" fill="#3A3A3A"/>
  <!-- Belly -->
  <ellipse cx="100" cy="140" rx="30" ry="30" fill="white"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="38" fill="#3A3A3A"/>
  <!-- Eyes -->
  <circle cx="82" cy="78" r="8" fill="white"/>
  <circle cx="118" cy="78" r="8" fill="white"/>
  <circle cx="84" cy="79" r="5" fill="#3A3A3A"/>
  <circle cx="120" cy="79" r="5" fill="#3A3A3A"/>
  <circle cx="86" cy="77" r="2" fill="white"/>
  <circle cx="122" cy="77" r="2" fill="white"/>
  <!-- Beak -->
  <ellipse cx="100" cy="95" rx="8" ry="5" fill="#FFA502"/>
  <!-- Cheeks -->
  <circle cx="70" cy="90" r="7" fill="#FFB6C1" opacity="0.3"/>
  <circle cx="130" cy="90" r="7" fill="#FFB6C1" opacity="0.3"/>
  <!-- Wings -->
  <ellipse cx="55" cy="135" rx="15" ry="30" fill="#3A3A3A" transform="rotate(-10 55 135)"/>
  <ellipse cx="145" cy="135" rx="15" ry="30" fill="#3A3A3A" transform="rotate(10 145 135)"/>
  <!-- Feet -->
  <ellipse cx="80" cy="175" rx="15" ry="6" fill="#FFA502"/>
  <ellipse cx="120" cy="175" rx="15" ry="6" fill="#FFA502"/>
  <!-- Bow tie -->
  <polygon points="90,110 100,115 110,110 100,120" fill="#FF6B6B"/>
</svg>