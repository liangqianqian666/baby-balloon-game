<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ears -->
  <polygon points="55,65 70,25 90,60" fill="#F4A460" stroke="#E8924A" stroke-width="2"/>
  <polygon points="145,65 130,25 110,60" fill="#F4A460" stroke="#E8924A" stroke-width="2"/>
  <polygon points="62,62 73,35 85,58" fill="#FFD1DC"/>
  <polygon points="138,62 127,35 115,58" fill="#FFD1DC"/>
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="55" ry="50" fill="#F4A460"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="#F4A460"/>
  <!-- Stripes -->
  <path d="M75,55 Q80,65 75,75" stroke="#E8924A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M125,55 Q120,65 125,75" stroke="#E8924A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M95,48 Q100,55 105,48" stroke="#E8924A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Belly -->
  <ellipse cx="100" cy="135" rx="35" ry="30" fill="#FDEBD0"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="82" rx="10" ry="11" fill="white"/>
  <ellipse cx="118" cy="82" rx="10" ry="11" fill="white"/>
  <circle cx="84" cy="83" r="6" fill="#3A3A3A"/>
  <circle cx="120" cy="83" r="6" fill="#3A3A3A"/>
  <circle cx="86" cy="80" r="2.5" fill="white"/>
  <circle cx="122" cy="80" r="2.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="100" cy="95" rx="5" ry="3.5" fill="#FF8FAB"/>
  <!-- Mouth -->
  <path d="M95,99 Q100,105 105,99" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="60" y1="90" x2="80" y2="93" stroke="#3A3A3A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="60" y1="98" x2="80" y2="97" stroke="#3A3A3A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="140" y1="90" x2="120" y2="93" stroke="#3A3A3A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="140" y1="98" x2="120" y2="97" stroke="#3A3A3A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="68" cy="97" r="8" fill="#FFB6C1" opacity="0.5"/>
  <circle cx="132" cy="97" r="8" fill="#FFB6C1" opacity="0.5"/>
  <!-- Paws -->
  <ellipse cx="75" cy="170" rx="15" ry="10" fill="#F4A460" stroke="#E8924A" stroke-width="1.5"/>
  <ellipse cx="125" cy="170" rx="15" ry="10" fill="#F4A460" stroke="#E8924A" stroke-width="1.5"/>
  <!-- Tail -->
  <path d="M155,130 Q175,110 165,90" stroke="#F4A460" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>