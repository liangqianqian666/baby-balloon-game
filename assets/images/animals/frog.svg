<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="125" rx="45" ry="40" fill="#6BCB77"/>
  <!-- Belly -->
  <ellipse cx="100" cy="132" rx="30" ry="25" fill="#A5D6A7"/>
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="42" ry="35" fill="#6BCB77"/>
  <!-- Big eyes -->
  <circle cx="78" cy="70" r="15" fill="white"/>
  <circle cx="122" cy="70" r="15" fill="white"/>
  <circle cx="82" cy="72" r="8" fill="#3A3A3A"/>
  <circle cx="126" cy="72" r="8" fill="#3A3A3A"/>
  <circle cx="85" cy="69" r="3" fill="white"/>
  <circle cx="129" cy="69" r="3" fill="white"/>
  <!-- Cheeks -->
  <circle cx="65" cy="88" r="8" fill="#FFB6C1" opacity="0.4"/>
  <circle cx="135" cy="88" r="8" fill="#FFB6C1" opacity="0.4"/>
  <!-- Mouth -->
  <path d="M85,95 Q100,108 115,95" stroke="#3A3A3A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Front legs -->
  <ellipse cx="78" cy="165" rx="10" ry="12" fill="#6BCB77"/>
  <ellipse cx="122" cy="165" rx="10" ry="12" fill="#6BCB77"/>
  <!-- Back legs (folded) -->
