<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <ellipse cx="100" cy="135" rx="40" ry="38" fill="#8B5E3C"/>
  <!-- Belly -->
  <ellipse cx="100" cy="140" rx="25" ry="22" fill="#D4915E"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="42" fill="#8B5E3C"/>
  <!-- Ear tufts -->
  <polygon points="60,50 50,25 75,55" fill="#5C3A1E"/>
  <polygon points="140,50 150,25 125,55" fill="#5C3A1E"/>
  <!-- Face disk -->
  <circle cx="100" cy="82" r="32" fill="#D4915E"/>
  <!-- Eyes -->
  <circle cx="82" cy="78" r="10" fill="#3A3A3A"/>
  <circle cx="118" cy="78" r="10" fill="#3A3A3A"/>
  <circle cx="85" cy="76" r="4" fill="white"/>
  <circle cx="121" cy="76" r="4" fill="white"/>
  <circle cx="82" cy="82" r="2" fill="#FFD93D"/>
  <circle cx="118" cy="82" r="2" fill="#FFD93D"/>
  <!-- Beak -->
  <polygon points="93,90 100,100 107,90" fill="#FFA502"/>
  <!-- Cheeks -->
  <circle cx="68" cy="92" r="7" fill="#FFB6C1" opacity="0.35"/>
  <circle cx="132" cy="92" r="7" fill="#FFB6C1" opacity="0.35"/>
  <!-- Wings -->
  <ellipse cx="58" cy="130" rx="14" ry="28" fill="#8B5E3C" transform="rotate(10 58 130)"/>
  <ellipse cx="142" cy="130" rx="14" ry="28" fill="#8B5E3C" transform="rotate(-10 142 130)"/>
  <!-- Feet -->
  <ellipse cx="85" cy="172" rx="12" ry="6" fill="#8B5E3C"/>
  <ellipse cx="115" cy="172" rx="12" ry="6" fill="#8B5E3C"/>
</svg>