<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cheese wedge -->
  <polygon points="30,150 170,150 170,90 30,150" fill="#FFD93D" stroke="#F0C419" stroke-width="2"/>
  <!-- Top face -->
  <polygon points="30,150 170,90 100,60 30,150" fill="#FFEC8B"/>
  <!-- Side face -->
  <rect x="30" y="150" width="140" height="20" rx="3" fill="#E6B800"/>
  <!-- Holes -->
  <circle cx="80" cy="130" r="10" fill="#F0C419"/>
  <circle cx="130" cy="120" r="8" fill="#F0C419"/>
  <circle cx="110" cy="145" r="6" fill="#F0C419"/>
  <!-- Eyes -->
  <circle cx="75" cy="105" r="6" fill="#3A3A3A"/>
  <circle cx="110" cy="95" r="6" fill="#3A3A3A"/>
  <circle cx="77" cy="103" r="2.5" fill="white"/>
  <circle cx="112" cy="93" r="2.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="62" cy="118" r="7" fill="#FFB6C1" opacity="0.4"/>
  <circle cx="122" cy="108" r="7" fill="#FFB6C1" opacity="0.4"/>
  <!-- Mouth -->
  <path d="M85,115 Q95,122 100,112" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>