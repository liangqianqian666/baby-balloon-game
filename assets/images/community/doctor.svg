<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body/coat -->
  <rect x="60" y="110" width="80" height="70" rx="15" fill="white"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#FDEBD0"/>
  <!-- Hair -->
  <path d="M65,70 Q65,40 100,35 Q135,40 135,70" fill="#5C3A1E"/>
  <!-- Head mirror -->
  <circle cx="100" cy="48" r="10" fill="#C0C0C0"/>
  <circle cx="100" cy="48" r="7" fill="#E8E8E8"/>
  <!-- Stethoscope -->
  <path d="M80,110 Q80,140 100,150 Q120,140 120,110" stroke="#3A3A3A" stroke-width="3" fill="none"/>
  <circle cx="100" cy="152" r="6" fill="#C0C0C0"/>
  <!-- Eyes -->
  <circle cx="85" cy="80" r="6" fill="#3A3A3A"/>
  <circle cx="115" cy="80" r="6" fill="#3A3A3A"/>
  <circle cx="87" cy="78" r="2.5" fill="white"/>
  <circle cx="117" cy="78" r="2.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="72" cy="92" r="7" fill="#FFB6C1" opacity="0.45"/>
  <circle cx="128" cy="92" r="7" fill="#FFB6C1" opacity="0.45"/>
  <!-- Mouth -->
  <path d="M92,97 Q100,104 108,97" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Pocket -->
  <rect x="70" y="125" width="20" height="15" rx="3" fill="#87CEEB" opacity="0.5"/>
</svg>