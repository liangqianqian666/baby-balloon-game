<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <rect x="60" y="110" width="80" height="70" rx="15" fill="white"/>
  <!-- Buttons -->
  <circle cx="100" cy="125" r="3" fill="#3A3A3A"/>
  <circle cx="100" cy="140" r="3" fill="#3A3A3A"/>
  <circle cx="100" cy="155" r="3" fill="#3A3A3A"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#FDEBD0"/>
  <!-- Chef hat -->
  <ellipse cx="100" cy="38" rx="30" ry="25" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="70" y="48" width="60" height="15" rx="3" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="85" cy="80" r="6" fill="#3A3A3A"/>
  <circle cx="115" cy="80" r="6" fill="#3A3A3A"/>
  <circle cx="87" cy="78" r="2.5" fill="white"/>
  <circle cx="117" cy="78" r="2.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="72" cy="92" r="7" fill="#FFB6C1" opacity="0.45"/>
  <circle cx="128" cy="92" r="7" fill="#FFB6C1" opacity="0.45"/>
  <!-- Mouth -->
  <path d="M92,97 Q100,104 108,97" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Spatula -->
  <rect x="145" y="100" width="5" height="55" rx="2" fill="#8B5E3C"/>
  <ellipse cx="148" cy="95" rx="12" ry="8" fill="#C0C0C0"/>
