  <!-- Wings badge -->
  <path d="M85,55 Q100,48 115,55" stroke="#FFD93D" stroke-width="2" fill="none"/>
  <circle cx="100" cy="55" r="4" fill="#FFD93D"/>
  <!-- Eyes -->
  <circle cx="85" cy="78" r="6" fill="#3A3A3A"/>
  <circle cx="115" cy="78" r="6" fill="#3A3A3A"/>
  <circle cx="87" cy="76" r="2.5" fill="white"/>
  <circle cx="117" cy="76" r="2.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="72" cy="90" r="7" fill="#FFB6C1" opacity="0.45"/>
  <circle cx="128" cy="90" r="7" fill="#FFB6C1" opacity="0.45"/>
  <!-- Mouth -->
  <path d="M92,96 Q100,103 108,96" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>