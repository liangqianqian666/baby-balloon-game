<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body/uniform -->
  <rect x="60" y="110" width="80" height="70" rx="15" fill="#1E3A7A"/>
  <!-- Epaulettes -->
  <rect x="55" y="110" width="20" height="8" rx="3" fill="#FFD93D"/>
  <rect x="125" y="110" width="20" height="8" rx="3" fill="#FFD93D"/>
  <!-- Tie -->
  <polygon points="97,115 103,115 100,150" fill="#FF4757"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#FDEBD0"/>
  <!-- Pilot hat -->
  <path d="M62,75 Q62,50 100,42 Q138,50 138,75Z" fill="#1E3A7A"/>
  <rect x="58" y="70" width="84" height="10" rx="3" fill="#2850A0"/>
