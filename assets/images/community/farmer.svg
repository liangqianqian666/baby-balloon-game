<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body/overalls -->
  <rect x="60" y="110" width="80" height="70" rx="15" fill="#4CAF50"/>
  <!-- Straps -->
  <rect x="72" y="105" width="10" height="30" rx="3" fill="#388E3C"/>
  <rect x="118" y="105" width="10" height="30" rx="3" fill="#388E3C"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#FDEBD0"/>
  <!-- Straw hat -->
  <ellipse cx="100" cy="55" rx="45" ry="10" fill="#F4C566"/>
  <path d="M68,55 Q68,30 100,25 Q132,30 132,55" fill="#FFD93D"/>
  <!-- Eyes -->
  <circle cx="85" cy="80" r="6" fill="#3A3A3A"/>
  <circle cx="115" cy="80" r="6" fill="#3A3A3A"/>
  <circle cx="87" cy="78" r="2.5" fill="white"/>
  <circle cx="117" cy="78" r="2.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="72" cy="92" r="7" fill="#FFB6C1" opacity="0.45"/>
  <circle cx="128" cy="92" r="7" fill="#FFB6C1" opacity="0.45"/>
  <!-- Mouth -->
  <path d="M92,97 Q100,104 108,97" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Pitchfork -->
  <rect x="148" y="70" width="4" height="90" rx="1" fill="#8B5E3C"/>
  <path d="M142,70 L150,55 L158,70" stroke="#8B5E3C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="150" y1="55" x2="150" y2="70" stroke="#8B5E3C" stroke-width="3"/>
</svg>