<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Muffin wrapper -->
  <path d="M45,110 L55,170 L145,170 L155,110Z" fill="#E8C9A0"/>
  <path d="M50,120 L55,170 L145,170 L150,120" fill="none" stroke="#D4A870" stroke-width="1"/>
  <!-- Wrapper ridges -->
  <line x1="65" y1="115" x2="62" y2="170" stroke="#D4A870" stroke-width="0.8"/>
  <line x1="85" y1="112" x2="83" y2="170" stroke="#D4A870" stroke-width="0.8"/>
  <line x1="105" y1="112" x2="105" y2="170" stroke="#D4A870" stroke-width="0.8"/>
  <line x1="125" y1="112" x2="127" y2="170" stroke="#D4A870" stroke-width="0.8"/>
  <line x1="140" y1="115" x2="142" y2="170" stroke="#D4A870" stroke-width="0.8"/>
  <!-- Muffin top -->
  <path d="M40,115 Q50,60 100,55 Q150,60 160,115Z" fill="#D4915E"/>
  <!-- Chocolate chips -->
  <circle cx="75" cy="90" r="5" fill="#5C3A1E"/>
  <circle cx="110" cy="80" r="4" fill="#5C3A1E"/>
  <circle cx="130" cy="95" r="5" fill="#5C3A1E"/>
  <!-- Eyes -->
  <circle cx="82" cy="95" r="5" fill="#3A3A3A"/>
  <circle cx="118" cy="95" r="5" fill="#3A3A3A"/>
  <circle cx="84" cy="93" r="2" fill="white"/>
  <circle cx="120" cy="93" r="2" fill="white"/>
  <!-- Cheeks -->
  <circle cx="68" cy="105" r="7" fill="#FFB6C1" opacity="0.35"/>
  <circle cx="132" cy="105" r="7" fill="#FFB6C1" opacity="0.35"/>
  <!-- Mouth -->
  <path d="M92,108 Q100,115 108,108" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>