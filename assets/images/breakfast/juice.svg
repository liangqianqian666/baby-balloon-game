<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Glass -->
  <path d="M60,45 L55,160 Q55,175 100,175 Q145,175 145,160 L140,45Z" fill="#FFA502" opacity="0.8"/>
  <!-- Glass outline -->
  <path d="M60,45 L55,160 Q55,175 100,175 Q145,175 145,160 L140,45" stroke="#E8924A" stroke-width="2" fill="none"/>
  <!-- Rim -->
  <ellipse cx="100" cy="45" rx="40" ry="8" fill="#FFB74D" stroke="#E8924A" stroke-width="1.5"/>
  <!-- Highlight -->
  <rect x="125" y="60" width="6" height="80" rx="3" fill="white" opacity="0.3"/>
  <!-- Straw -->
  <rect x="115" y="20" width="5" height="120" rx="2" fill="#FF6B6B" transform="rotate(10 117 80)"/>
  <!-- Eyes -->
  <circle cx="85" cy="100" r="6" fill="#3A3A3A"/>
  <circle cx="115" cy="100" r="6" fill="#3A3A3A"/>
  <circle cx="87" cy="98" r="2.5" fill="white"/>
  <circle cx="117" cy="98" r="2.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="72" cy="112" r="7" fill="#FFB6C1" opacity="0.35"/>
  <circle cx="128" cy="112" r="7" fill="#FFB6C1" opacity="0.35"/>
  <!-- Mouth -->
  <path d="M93,118 Q100,125 107,118" stroke="#3A3A3A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>