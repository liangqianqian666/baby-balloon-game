<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Toast body -->
  <rect x="40" y="50" width="120" height="110" rx="15" fill="#F4C566"/>
  <!-- Crust -->
  <rect x="40" y="50" width="120" height="110" rx="15" fill="none" stroke="#D4915E" stroke-width="4"/>
  <!-- Butter pat -->
  <rect x="65" y="80" width="70" height="40" rx="8" fill="#FFE88D" opacity="0.7"/>
  <!-- Eyes -->
  <circle cx="80" cy="100" r="6" fill="#3A3A3A"/>
  <circle cx="120" cy="100" r="6" fill="#3A3A3A"/>
  <circle cx="82" cy="98" r="2.5" fill="white"/>
  <circle cx="122" cy="98" r="2.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="65" cy="115" r="8" fill="#FFB6C1" opacity="0.4"/>
  <circle cx="135" cy="115" r="8" fill="#FFB6C1" opacity="0.4"/>
  <!-- Mouth -->
  <path d="M90,122 Q100,130 110,122" stroke="#3A3A3A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>