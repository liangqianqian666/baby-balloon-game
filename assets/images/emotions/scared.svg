<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Face -->
  <circle cx="100" cy="100" r="70" fill="#CE93D8"/>
  <!-- Wide eyes -->
  <circle cx="78" cy="88" r="14" fill="white"/>
  <circle cx="122" cy="88" r="14" fill="white"/>
  <circle cx="78" cy="90" r="7" fill="#3A3A3A"/>
  <circle cx="122" cy="90" r="7" fill="#3A3A3A"/>
  <circle cx="80" cy="87" r="3" fill="white"/>
  <circle cx="124" cy="87" r="3" fill="white"/>
  <!-- Raised eyebrows -->
  <path d="M62,65 Q78,58 92,65" stroke="#3A3A3A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M108,65 Q122,58 138,65" stroke="#3A3A3A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Open mouth -->
