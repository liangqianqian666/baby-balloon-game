  <!-- Zzz -->
  <text x="140" y="60" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3A3A3A">z</text>
  <text x="152" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3A3A3A">z</text>
  <text x="161" y="33" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3A3A3A">z</text>
  <!-- Cheeks -->
  <circle cx="65" cy="108" r="8" fill="#FFB6C1" opacity="0.4"/>
  <circle cx="135" cy="108" r="8" fill="#FFB6C1" opacity="0.4"/>
