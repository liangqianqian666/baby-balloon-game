  <path d="M140,70 L112,80" stroke="#3A3A3A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="78" cy="92" r="7" fill="#3A3A3A"/>
  <circle cx="122" cy="92" r="7" fill="#3A3A3A"/>
  <!-- Grumpy mouth -->
