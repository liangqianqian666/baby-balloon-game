<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Back wheel -->
  <circle cx="60" cy="145" r="30" fill="#3A3A3A"/>
  <circle cx="60" cy="145" r="18" fill="#888"/>
  <circle cx="60" cy="145" r="5" fill="#3A3A3A"/>
  <!-- Front wheel -->
  <circle cx="150" cy="145" r="25" fill="#3A3A3A"/>
  <circle cx="150" cy="145" r="15" fill="#888"/>
  <circle cx="150" cy="145" r="4" fill="#3A3A3A"/>
  <!-- Frame -->
  <line x1="60" y1="145" x2="110" y2="90" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="145" x2="120" y2="120" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="120" x2="150" y2="145" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="90" x2="120" y2="120" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebars -->
  <line x1="110" y1="90" x2="130" y2="80" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="75" x2="135" y2="85" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="95" cy="88" rx="15" ry="5" fill="#3A3A3A"/>
  <!-- Pedal -->
  <circle cx="120" cy="120" r="6" fill="#888"/>
  <!-- Bell -->
  <circle cx="133" cy="75" r="6" fill="#FFD93D"/>
  <!-- Eyes on bell -->
  <circle cx="131" cy="74" r="2" fill="#3A3A3A"/>
  <circle cx="136" cy="74" r="2" fill="#3A3A3A"/>
  <circle cx="131" cy="73" r="1" fill="white"/>
  <circle cx="136" cy="73" r="1" fill="white"/>
</svg>