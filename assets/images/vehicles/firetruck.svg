<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body -->
  <rect x="20" y="65" width="160" height="70" rx="12" fill="#FF4757"/>
  <!-- Cabin -->
  <rect x="130" y="45" width="45" height="55" rx="8" fill="#FF6B6B"/>
  <!-- Windshield -->
  <rect x="140" y="52" width="28" height="22" rx="5" fill="#B0E0E6"/>
  <!-- Ladder -->
  <rect x="25" y="38" width="100" height="10" rx="3" fill="#C0C0C0"/>
  <line x1="35" y1="38" x2="35" y2="48" stroke="#A0A0A0" stroke-width="2"/>
  <line x1="55" y1="38" x2="55" y2="48" stroke="#A0A0A0" stroke-width="2"/>
  <line x1="75" y1="38" x2="75" y2="48" stroke="#A0A0A0" stroke-width="2"/>
  <line x1="95" y1="38" x2="95" y2="48" stroke="#A0A0A0" stroke-width="2"/>
  <line x1="115" y1="38" x2="115" y2="48" stroke="#A0A0A0" stroke-width="2"/>
  <!-- Stripe -->
  <rect x="20" y="100" width="110" height="8" rx="3" fill="white" opacity="0.6"/>
  <!-- Side panel -->
  <rect x="30" y="72" width="40" height="25" rx="4" fill="#E0E0E0"/>
  <!-- Light -->
  <rect x="75" y="52" width="15" height="12" rx="6" fill="#FFD93D"/>
  <!-- Bumper -->
  <rect x="15" y="135" width="170" height="8" rx="3" fill="#C0C0C0"/>
  <!-- Wheels -->
  <circle cx="55" cy="148" r="18" fill="#3A3A3A"/>
  <circle cx="55" cy="148" r="9" fill="#888"/>
  <circle cx="150" cy="148" r="18" fill="#3A3A3A"/>
  <circle cx="150" cy="148" r="9" fill="#888"/>
  <!-- Eyes -->
  <circle cx="148" cy="60" r="4" fill="#3A3A3A"/>
  <circle cx="160" cy="60" r="4" fill="#3A3A3A"/>
  <circle cx="149" cy="59" r="1.5" fill="white"/>
  <circle cx="161" cy="59" r="1.5" fill="white"/>
</svg>