<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Clock body -->
  <circle cx="100" cy="100" r="65" fill="white" stroke="#42A5F5" stroke-width="6"/>
  <!-- Hour marks -->
  <circle cx="100" cy="42" r="4" fill="#42A5F5"/>
  <circle cx="100" cy="158" r="4" fill="#42A5F5"/>
  <circle cx="42" cy="100" r="4" fill="#42A5F5"/>
  <circle cx="158" cy="100" r="4" fill="#42A5F5"/>
  <!-- Hour hand -->
  <line x1="100" y1="100" x2="100" y2="65" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="100" y1="100" x2="130" y2="80" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="5" fill="#E53935"/>
  <!-- Face -->
  <circle cx="85" cy="95" r="3" fill="#3A3A3A"/>
  <circle cx="115" cy="95" r="3" fill="#3A3A3A"/>
  <path d="M90,112 Q100,118 110,112" stroke="#3A3A3A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
