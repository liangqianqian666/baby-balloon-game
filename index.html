<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop the Balloon! 🎈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 关卡选择界面 -->
  <div id="level-screen">
    <div class="level-content">
      <h1 style="font-size: 36px; color: #FF6B6B; text-shadow: 2px 2px 0 #fff; margin-bottom: 4px;">Pop the Balloon! 🎈</h1>
      <p style="font-size: 16px; color: #888; margin-bottom: 4px; font-style: italic;">For Luna, my everything</p>
      <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">Made by Luna's mama Sisi ⭐</p>
      <h2>Pick a Game!</h2>
      <div id="profile-selector" style="margin-bottom: 16px;">
        <span style="font-size: 16px; color: #555; margin-right: 8px;">👤 玩家：</span>
        <div id="profile-list" style="display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap;"></div>
      </div>
      <div id="bg-toggle" style="margin-bottom: 20px;">
        <span style="font-size: 16px; color: #555; margin-right: 8px;">背景模式：</span>
        <button class="bg-mode-btn" data-mode="none">无背景</button>
        <button class="bg-mode-btn" data-mode="transparent">半透明背景</button>
      </div>
      <div id="style-toggle" style="margin-bottom: 20px;">
        <span style="font-size: 16px; color: #555; margin-right: 8px;">图片风格：</span>
        <button class="bg-mode-btn style-btn" data-style="svg">🎨 手绘</button>
        <button class="bg-mode-btn style-btn" data-style="photo">📷 实物照片</button>
      </div>
      <div id="stars-toggle" style="margin-bottom: 20px;">
        <span style="font-size: 16px; color: #555; margin-right: 8px;">通关星星：</span>
        <button class="stars-adj-btn" id="stars-minus">−</button>
        <span id="stars-value" style="font-size: 20px; font-weight: bold; color: #FFD700; min-width: 40px; display: inline-block; text-align: center;">15</span>
        <button class="stars-adj-btn" id="stars-plus">+</button>
      </div>
      <div id="level-buttons"></div>
    </div>
  </div>

  <!-- 游戏画面 -->
  <canvas id="game-canvas"></canvas>

  <!-- 摄像头预览小窗 -->
  <video id="camera-video" autoplay playsinline></video>

  <!-- 星星计数器 -->
  <div id="score-display">⭐ <span id="score">0</span></div>

  <!-- 游戏中操作按钮 -->
  <div id="game-buttons" style="display:none; position:fixed; top:16px; right:16px; z-index:10; display:none;">
    <button id="btn-skip" title="换一局" style="font-size:28px; width:48px; height:48px; border:none; border-radius:50%; background:rgba(255,255,255,0.8); cursor:pointer; margin-left:8px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">🔀</button>
    <button id="btn-back" title="返回主页" style="font-size:28px; width:48px; height:48px; border:none; border-radius:50%; background:rgba(255,255,255,0.8); cursor:pointer; margin-left:8px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">🏠</button>
  </div>

  <!-- 当前目标颜色提示 -->
  <div id="color-hint"></div>

  <!-- 隐藏的 video 用于 MoveNet 推理 -->
  <video id="pose-video" autoplay playsinline style="display:none"></video>

  <!-- TensorFlow.js + MoveNet (身体追踪) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.17.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.17.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.17.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

  <!-- MediaPipe Hands (手部追踪) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>


  <script src="js/config.js?v=15"></script>
  <script src="js/audio.js?v=15"></script>
  <script src="js/analytics.js?v=15"></script>
  <script src="js/levels.js?v=15"></script>
  <script src="js/spaced-rep.js?v=15"></script>
  <script src="js/balloon.js?v=15"></script>
  <script src="js/hand-cursor.js?v=15"></script>
  <script src="js/camera.js?v=15"></script>
  <script src="js/game.js?v=15"></script>
  <script src="js/main.js?v=15"></script>
</body>
</html>
