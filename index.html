<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop the Balloon! 🎈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 开始按钮（需要用户交互才能开启摄像头和音频） -->
  <div id="start-screen">
    <div class="start-content">
      <h1>🎈 Pop the Balloon!</h1>
      <p>Stand in front of the camera and use your hands to pop balloons!</p>
      <button id="start-btn" onclick="startGame()">▶ START</button>
    </div>
  </div>

  <!-- 游戏画面 -->
  <canvas id="game-canvas"></canvas>

  <!-- 摄像头预览小窗 -->
  <video id="camera-video" autoplay playsinline></video>

  <!-- 星星计数器 -->
  <div id="score-display">⭐ <span id="score">0</span></div>

  <!-- 当前目标颜色提示 -->
  <div id="color-hint"></div>

  <!-- 隐藏的 video 用于 MoveNet 推理 -->
  <video id="pose-video" autoplay playsinline style="display:none"></video>

  <!-- TensorFlow.js + MoveNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.17.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.17.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.17.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

  <script src="js/audio.js"></script>
  <script src="js/balloon.js"></script>
  <script src="js/hand-cursor.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
